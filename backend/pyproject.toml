[project]
name = "northbridge-kyc"
version = "0.1.0"
description = "Northbridge KYC - applicant onboarding and document-consistency verification (with human review)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.10,<2",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7",
    "google-genai>=1.0",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "rapidfuzz>=3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "reportlab>=4.2",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "postgres: requires a PostgreSQL TEST_POSTGRES_URL",
    "live_gemini: makes a real call to Gemini with synthetic data (opt-in)",
    "ocr: requires the Tesseract binary",
]
addopts = "-m 'not live_gemini'"

[tool.ruff]
line-length = 110
target-version = "py312"
